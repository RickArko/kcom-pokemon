competition:
  name: pokemon-tcg-ai-battle-challenge-strategy
  url: https://www.kaggle.com/competitions/pokemon-tcg-ai-battle-challenge-strategy
  metric: accuracy
  target: winner

paths:
  data: data/
  outputs: outputs/
  submissions: outputs/submissions/
  models: models/

features:
  drop_cols:
    - id
    - match_id
    - game_id
    - timestamp
    - round
    - event
  diff_pairs:
    - [player_active_pokemon_hp, opponent_active_pokemon_hp]
    - [player_bench_count, opponent_bench_count]
    - [player_hand_count, opponent_hand_count]
    - [player_deck_count, opponent_deck_count]
    - [opponent_prize_count, player_prize_count]
  cat_cols:
    - deck_name
    - opponent_deck_name
    - player_active_pokemon_name
    - opponent_active_pokemon_name
  encoding: ohe

data: {}

cv:
  n_splits: 3
  shuffle: true
  random_state: 42

lgbm:
  n_estimators: 250
  learning_rate: 0.05
  num_leaves: 63
  max_depth: -1
  min_child_samples: 20
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 0.1
  random_state: 42
  n_jobs: -1
  verbose: -1

xgb:
  n_estimators: 250
  learning_rate: 0.05
  max_depth: 6
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 1.0
  eval_metric: logloss
  random_state: 42
  n_jobs: -1

catboost:
  iterations: 250
  learning_rate: 0.05
  depth: 6
  l2_leaf_reg: 3
  random_seed: 42
  verbose: 0

meta:
  max_iter: 1000
  random_state: 42
