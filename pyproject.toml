[project]
name = "kcom-pokemon"
version = "0.1.0"
description = "Kaggle competition: Pokemon TCG AI Battle Challenge - agent builder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kaggle>=2.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokemon"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
