[project]
name = "kcom-pokemon"
version = "0.1.0"
description = "Kaggle competition: Pokemon TCG AI Battle Challenge - agent builder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jupyter[dev]>=1.1.1",
    "kaggle>=2.2",
    "matplotlib[dev]>=3.11.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "pyyaml>=6.0",
    "seaborn[dev]>=0.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pre-commit>=3.7",
    "ruff>=0.15.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokemon"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
